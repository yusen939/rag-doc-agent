<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocPilot · 文档问答 Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">D</div>
        <div>
          <h1>DocPilot</h1>
          <p>RAG · Function Calling</p>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-heading">
          <span>知识库</span>
          <span id="doc-count" class="counter">0 篇</span>
        </div>
        <button id="upload-trigger" class="upload-button" type="button">
          <span class="plus">+</span> 上传文档
        </button>
        <input id="file-input" type="file" accept=".pdf,.txt,.md,.markdown" hidden>
        <p class="hint">支持 PDF / TXT / Markdown，单个文件不超过 20 MB</p>
        <div id="document-list" class="document-list"></div>
      </div>

      <div class="sidebar-footer">
        <button id="new-chat" class="text-button" type="button">开始新对话</button>
        <span class="status-dot"><i></i> 本地 Ollama</span>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <span class="eyebrow">KNOWLEDGE ASSISTANT</span>
          <h2>基于你的文档回答，而不是凭感觉</h2>
        </div>
        <a class="api-link" href="/docs" target="_blank" rel="noreferrer">API 文档 ↗</a>
      </header>

      <section id="chat" class="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-orbit"><span>?</span></div>
          <h3>先上传资料，再开始提问</h3>
          <p>我会先检索相关片段，再结合 Function Calling 计算或查询工具生成回答，并标注引用来源。</p>
          <div class="suggestions">
            <button class="suggestion" type="button">这份文档的核心结论是什么？</button>
            <button class="suggestion" type="button">帮我对比文档中的两个方案</button>
            <button class="suggestion" type="button">根据文档数据计算一下结果</button>
          </div>
        </div>
      </section>

      <form id="chat-form" class="composer">
        <textarea id="question" rows="1" maxlength="4000" placeholder="向知识库提问，Enter 发送，Shift + Enter 换行"></textarea>
        <button id="send" type="submit" aria-label="发送问题">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="disclaimer">回答由本地模型生成，请结合引用内容核验重要信息。</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
